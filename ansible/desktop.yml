---
- hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    extended_brew: false
  tasks:
    - import_tasks: modules/common.yml
      tags: [common]
    - import_tasks: modules/shell.yml
      tags: [shell]
    - import_tasks: modules/dotfiles.yml
      tags: [dotfiles]
    - import_tasks: modules/brew.yml
      tags: [brew]
    - import_tasks: modules/yay.yml
      tags: [yay]
