---
- name: Homebrew. Define installation paths
  ansible.builtin.set_fact:
    brew_prefix: >-
      {{
        '/opt/homebrew'
        if ansible_facts.os_family == 'Darwin' and ansible_facts.architecture in ['arm64', 'aarch64']
        else '/usr/local'
        if ansible_facts.os_family == 'Darwin'
        else '/home/linuxbrew/.linuxbrew'
      }}
  tags: [brew]

- name: Homebrew. Define executable paths
  ansible.builtin.set_fact:
    brew_bin: "{{ brew_prefix }}/bin/brew"
    brew_path: "{{ brew_prefix }}/bin"
  tags: [brew]

- name: Homebrew. Load packages list
  ansible.builtin.include_vars: pkgs/brew_packages.yml
  tags: [brew]

- name: Homebrew. Check existing installation
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: brew_bin_stat
  tags: [brew]

- name: Homebrew. Configure Linux installation directory
  ansible.builtin.file:
    path: /home/linuxbrew
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  become: true
  when:
    - ansible_facts.os_family != "Darwin"
    - not brew_bin_stat.stat.exists
  tags: [brew]

- name: Homebrew. Download installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    dest: /tmp/homebrew-install.sh
    mode: "0755"
    force: true
  register: brew_installer_download
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_installer_download is succeeded
  when: not brew_bin_stat.stat.exists
  tags: [brew]

- name: Homebrew. Configure bounded curl retries
  ansible.builtin.copy:
    dest: /tmp/homebrew-curlrc
    mode: "0644"
    content: |
      connect-timeout = 20
      retry = 3
      retry-all-errors
      retry-delay = 5
  tags: [brew]

- name: Homebrew. Run installation script
  ansible.builtin.command: /bin/bash /tmp/homebrew-install.sh
  environment: &brew_environment
    NONINTERACTIVE: "1"
    HOMEBREW_NO_ANALYTICS: "1"
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_CURLRC: /tmp/homebrew-curlrc
    HOMEBREW_CURL_RETRIES: "3"
  register: brew_install_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_install_result is succeeded
  when: not brew_bin_stat.stat.exists
  tags: [brew]

- name: Homebrew. Refresh installation state
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: brew_bin_stat
  tags: [brew]

- name: Homebrew. Require successful installation
  ansible.builtin.assert:
    that: brew_bin_stat.stat.exists | default(false)
    fail_msg: "Homebrew was not installed at {{ brew_bin }}"
  tags: [brew]

- name: Homebrew. Show version
  ansible.builtin.command: "{{ brew_bin }} --version"
  register: brew_version_check
  changed_when: false
  tags: [brew]

- name: Homebrew. Version info
  ansible.builtin.debug:
    msg: "Homebrew version: {{ brew_version_check.stdout_lines | first }}"
  tags: [brew]

- name: Homebrew. Install macOS bootstrap packages
  community.general.homebrew:
    name: "{{ item }}"
    path: "{{ brew_path }}"
    state: present
  loop: "{{ brew_packages.bootstrap }}"
  register: brew_bootstrap_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_bootstrap_result is succeeded
  when: ansible_facts.os_family == "Darwin"
  environment: *brew_environment
  tags: [brew]

- name: Homebrew. Install shell prompt extensions
  community.general.homebrew:
    name: "{{ item }}"
    path: "{{ brew_path }}"
    state: present
  loop: "{{ brew_packages.extensions }}"
  register: brew_extensions_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_extensions_result is succeeded
  environment: *brew_environment
  tags: [brew]

- name: Homebrew. Install CLI tools
  community.general.homebrew:
    name: "{{ item }}"
    path: "{{ brew_path }}"
    state: present
  loop: "{{ brew_packages.cli_tools }}"
  register: brew_cli_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_cli_result is succeeded
  environment: *brew_environment
  tags: [brew]

- name: Homebrew. Install fonts
  community.general.homebrew:
    name: "{{ brew_packages.fonts }}"
    path: "{{ brew_path }}"
    state: present
  register: brew_fonts_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_fonts_result is succeeded
  environment: *brew_environment
  tags: [brew]

- name: Homebrew. Tap additional repositories
  community.general.homebrew_tap:
    name: "{{ item }}"
    path: "{{ brew_path }}"
    state: present
  loop: "{{ brew_packages.taps }}"
  register: brew_tap_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_tap_result is succeeded
  when: extended | bool
  environment: *brew_environment
  tags: [brew]

- name: Homebrew. Trust additional taps
  ansible.builtin.command: "{{ brew_bin }} trust --tap {{ item }}"
  loop: "{{ brew_packages.taps }}"
  changed_when: false
  when: extended | bool
  tags: [brew]

- name: Homebrew. Install optional packages
  community.general.homebrew:
    name: "{{ item }}"
    path: "{{ brew_path }}"
    state: present
  loop: "{{ brew_packages.optional }}"
  register: brew_optional_result
  retries: "{{ network_retries }}"
  delay: "{{ network_retry_delay }}"
  until: brew_optional_result is succeeded
  when: extended | bool
  environment: *brew_environment
  tags: [brew]
