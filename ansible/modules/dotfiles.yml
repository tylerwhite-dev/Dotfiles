---
- name: Dotfiles. Configure config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    mode: "0755"
  tags: [dotfiles]

- name: Dotfiles. Define needed
  ansible.builtin.set_fact:
    stow_packages: >-
      {{
        ['.', 'zsh_common', 'wallpaper'] + (['zsh_linux'] if ansible_facts.os_family != "Darwin" else ['zsh_mac'])
      }}
  tags: [dotfiles]

- name: Dotfiles. Find root package config files
  ansible.builtin.find:
    paths: "{{ dotfiles_repo_dir }}/.config"
    recurse: true
    file_type: file
    get_checksum: true
  register: dotfiles_config_source
  tags: [dotfiles]

- name: Dotfiles. Check existing config targets
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/{{ item.path | replace(dotfiles_repo_dir + '/.config/', '') }}"
    follow: false
  loop: "{{ dotfiles_config_source.files }}"
  register: dotfiles_config_targets
  loop_control:
    label: "{{ item.path | replace(dotfiles_repo_dir + '/.config/', '') }}"
  tags: [dotfiles]

- name: Dotfiles. Remove identical unmanaged config files
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ dotfiles_config_targets.results }}"
  loop_control:
    label: "{{ item.item.path | replace(dotfiles_repo_dir + '/.config/', '') }}"
  when:
    - item.stat.exists
    - item.stat.isreg
    - not item.stat.islnk
    - item.stat.checksum == item.item.checksum
  tags: [dotfiles]

- name: Dotfiles. Apply with GNU Stow
  ansible.builtin.command:
    argv:
      - stow
      - --no-folding
      - --verbose=1
      - "--target={{ ansible_facts.env.HOME }}"
      - "{{ item }}"
  loop: "{{ stow_packages }}"
  register: stow_result
  changed_when: stow_result.stderr is search('LINK:')
  failed_when: stow_result.rc != 0
  args:
    chdir: "{{ dotfiles_repo_dir }}"
  environment:
    HOME: "{{ ansible_facts.env.HOME }}"
  tags: [dotfiles]
