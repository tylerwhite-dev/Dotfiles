# Reload config: tmux source-file ~/.config/tmux/tmux.conf

# STATUS BAR

set -g status-bg                    colour235
set -g status-fg                    colour250
set -g status-left                  ""
set -g status-right                 "#[fg=colour68]%H:%M"

setw -g window-status-current-style "fg=colour68,bg=colour235"
setw -g window-status-separator     "  "

# COMMON
    
# Enable 256 color support  
set -g default-terminal             "tmux-256color"
set -ga terminal-overrides          ",*:RGB"
    
# History size  
set -g history-limit                1000
    
# Enable mouse support  
set -g mouse                        on
    
# Enable clipboard  
set -g set-clipboard                on
    
# Disable delay before escape   
set  -s escape-time                 0

# Pane devider line style
set -g pane-border-lines            single
set -g pane-border-style            "fg=colour240"
set -g pane-active-border-style     "fg=colour68"

# Pane and window index starts with 1
set -g base-index                   1
setw -g pane-base-index             1


# PANE

# Basic controls
bind -n M-w                         kill-pane                    # Close pane

# Select
bind -n M-h                         select-pane -L               # Go to left pane
bind -n M-l                         select-pane -R               # Go to right pane
bind -n M-k                         select-pane -U               # Go to top pane
bind -n M-j                         select-pane -D               # Go to bottom pane

# Zoom
bind -n M-Enter                     resize-pane -Z               # Toggle pane zoom


# WINDOW

# Basic controls
bind -n M-o                         choose-tree -w

bind -n M-n                         new-window                   # Create new window
bind -n M-C-q                       kill-window

# Switch
bind -n M-]                         next-window                  # Go to next window
bind -n M-[                         previous-window              # Go to previous window

bind -n M-C-1                       select-window -t 1  \; display-message "Window: #{window_index}"
bind -n M-C-2                       select-window -t 2  \; display-message "Window: #{window_index}"
bind -n M-C-3                       select-window -t 3  \; display-message "Window: #{window_index}"
bind -n M-C-4                       select-window -t 4  \; display-message "Window: #{window_index}"
bind -n M-C-5                       select-window -t 5  \; display-message "Window: #{window_index}"
bind -n M-C-6                       select-window -t 6  \; display-message "Window: #{window_index}"
bind -n M-C-7                       select-window -t 7  \; display-message "Window: #{window_index}"
bind -n M-C-8                       select-window -t 8  \; display-message "Window: #{window_index}"
bind -n M-C-9                       select-window -t 9  \; display-message "Window: #{window_index}"

# Split
bind -n M--                         split-window -v              # Split pane vertically
bind -n M-\\                        split-window -h             # Split pane horizontally


# SESSION

# Auto-kill numbered sessions on t  erminal close, keep named ones (e.g. main)
set-hook -g client-detached 'if-sh  ell "echo #{session_name} | grep -Eq \"^[0-9]+$\"" "kill-session"'

# Basic controls
bind -n M-C-N                       new-session
bind -n M-C-d                       detach
bind -n M-C-Q                       confirm-before -p "Quit session? (y/n)" kill-session