onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[ui]
# Possible values: "dots", "symbols"
status_indicators = "symbols"
sidebar_start_collapsed = true
# Possible values: "compact", "hidden"
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false
sidebar_width = 28
sidebar_min_width = 16
sidebar_max_width = 40
pane_gaps = false
# Possible values: "top", "bottom"
tab_bar_position = "bottom"

[ui.toast]
# Possible values: "off", "herdr", "terminal", "system"
delivery = "herdr"

[keys]

# Pane navigation
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Pane lifecycle and layout
close_pane = "alt+w"
split_vertical = "alt+5"
split_horizontal = "alt+6"
toggle_sidebar = "alt+s"

# Tabs and session navigation
goto = "alt+e"
new_tab = "alt+n"
close_tab = "alt+q"
previous_tab = "alt+9"
next_tab = "alt+0"

# Workspace and client session
new_workspace = "alt+shift+n"
